name: Web Pages
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'src/**'
      - 'utils/**'
      - '.github/workflows/web-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: read
concurrency:
  group: web-pages
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r web/requirements.txt
      - run: node --test web/tests/core.test.mjs web/tests/theme.test.mjs
      - run: python -m unittest discover -s web/tests -v
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/static
  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Web
        id: deployment
        uses: actions/deploy-pages@v4
